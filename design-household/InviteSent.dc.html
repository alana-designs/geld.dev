<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <style>
    body { margin: 0; }
    a { color: #c1743c; } a:hover { color: #a3562f; }
  </style>
</helmet>
<div style="position: relative; width: 560px; min-height: 480px; box-sizing: border-box; background: #a1a09d; display: flex; align-items: center; justify-content: center; padding: 32px 56px; font-family: Inter, system-ui, sans-serif;">
  <div style="position: relative; width: 448px; box-sizing: border-box; background: #ffffff; border: 1px solid #eceae5; border-radius: 16px; padding: 24px;">

    <div style="position: absolute; right: 16px; top: 16px; color: #a39d94; line-height: 0;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
    </div>

    <div style="width: 44px; height: 44px; border-radius: 999px; background: #faf9f7; color: #1c1a17; display: flex; align-items: center; justify-content: center;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>
    </div>

    <h2 style="margin: 16px 0 0; font-size: 20px; font-weight: 600; letter-spacing: -0.02em; color: #1c1a17;">Invite sent</h2>
    <p style="margin: 6px 0 0; font-size: 14px; line-height: 1.625; color: #6f6a62;">We emailed a link to <span style="font-weight: 500; color: #1c1a17;">jordan@example.com</span>. Nothing is shared yet &mdash; you get a final check once they accept.</p>

    <div style="margin-top: 18px; border: 1px solid #eceae5; border-radius: 12px; padding: 12px 14px; display: flex; align-items: center; gap: 12px;">
      <div style="flex-shrink: 0; width: 32px; height: 32px; border-radius: 999px; background: #8c6239; color: #ffffff; font-size: 11px; font-weight: 600; display: flex; align-items: center; justify-content: center;">J</div>
      <div style="flex-grow: 1; min-width: 0;">
        <div style="font-size: 14px; font-weight: 500; color: #1c1a17;">jordan@example.com</div>
        <div style="margin-top: 1px; font-size: 12px; color: #a39d94;">Waiting for them to accept</div>
      </div>
      <div style="flex-shrink: 0; display: flex; align-items: center; gap: 5px; border-radius: 999px; background: rgba(193,116,60,0.10); padding: 5px 9px;">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#c1743c" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
        <span style="font-size: 11px; font-weight: 600; color: #c1743c; font-variant-numeric: tabular-nums;">59 min</span>
      </div>
    </div>

    <div style="display: flex; gap: 8px; margin-top: 16px;">
      <button style="flex-grow: 1; border: 1px solid #eceae5; background: #ffffff; border-radius: 12px; padding: 12px 0; font-family: inherit; font-size: 14px; font-weight: 600; color: #1c1a17; cursor: pointer;">Cancel invite</button>
      <button style="flex-grow: 1; border: none; background: #38352f; border-radius: 12px; padding: 12px 0; font-family: inherit; font-size: 14px; font-weight: 600; color: #ffffff; cursor: pointer;">Done</button>
    </div>

    <p style="margin: 14px 0 0; font-size: 11px; line-height: 1.65; color: #a39d94;">If they don&rsquo;t accept within the hour the invite expires on its own and you can send another.</p>

  </div>
</div>
</x-dc>
<script data-dc-script data-props='{}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
